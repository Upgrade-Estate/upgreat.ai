name: Deploy to Bootload

on:
  push:
    branches: [claude/solar-wind-energy-viz-gjrpqw]
  workflow_dispatch:

concurrency:
  group: bootload
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BOOTLOAD_TOKEN: ${{ secrets.BL_DEPLOY }}
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t energy-loop:${{ github.sha }} .

      - name: Install bootload CLI
        run: |
          curl -fsSL https://bootload.io/v1/cli/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v bootload || export PATH="$PATH:/usr/local/bin:$HOME/.local/bin"
          bootload version || true

      - name: Push image to bootload registry
        id: push
        run: |
          set -euo pipefail
          bootload image login
          OUT=$(bootload image push energy-loop:${{ github.sha }} 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT"
          IMAGE=$(echo "$OUT" | grep -oE 'registry\.bootload\.io/[^[:space:]]+' | head -1)
          if [ -z "$IMAGE" ]; then
            echo "Could not determine pushed image ref from CLI output" >&2
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy service
        run: |
          set -euo pipefail
          OUT=$(bootload deploy --image "${{ steps.push.outputs.image }}" --port 80:http --publish --name energy-loop 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[^[:space:]]+' | head -1)
          {
            echo "### Bootload deployment"
            echo ""
            echo "Image: \`${{ steps.push.outputs.image }}\`"
            [ -n "$URL" ] && echo "URL: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Service status
        run: bootload status energy-loop
