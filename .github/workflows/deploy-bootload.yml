name: Deploy to Bootload

on:
  push:
    branches: [claude/solar-wind-energy-viz-gjrpqw]
  workflow_dispatch:

concurrency:
  group: bootload
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BOOTLOAD_TOKEN: ${{ secrets.BL_DEPLOY }}
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t energy-loop:${{ github.sha }} .

      - name: Install bootload CLI
        run: |
          curl -fsSL https://bootload.io/v1/cli/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v bootload || export PATH="$PATH:/usr/local/bin:$HOME/.local/bin"
          bootload version || true

      - name: Push image to bootload registry
        id: push
        run: |
          set -euo pipefail
          bootload image login
          OUT=$(bootload image push energy-loop:${{ github.sha }} 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT"
          # docker prints the repo in brackets and without the tag — strip and re-tag.
          IMAGE=$(echo "$OUT" | tr -d '[]' | grep -oE 'registry\.bootload\.io/[^[:space:]]+' | head -1)
          if [ -z "$IMAGE" ]; then
            echo "Could not determine pushed image ref from CLI output" >&2
            exit 1
          fi
          case "$IMAGE" in *:*) ;; *) IMAGE="$IMAGE:${{ github.sha }}" ;; esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy service
        run: |
          set -euo pipefail
          IMAGE="${{ steps.push.outputs.image }}"
          if ! OUT=$(bootload deploy --project test1 --image "$IMAGE" --port 80:http --publish --name energy-loop 2>&1); then
            echo "$OUT"
            case "$OUT" in
              *"already exists"*)
                echo "Service exists — rolling out new image instead."
                OUT=$(bootload restart energy-loop --project test1 --image "$IMAGE" 2>&1) || { echo "$OUT"; exit 1; }
                ;;
              *) exit 1 ;;
            esac
          fi
          echo "$OUT"
          # Route is printed without a scheme (e.g. "route foo.fr1.apps.bootload.io -> :80").
          HOST=$(echo "$OUT" | grep -oE '[a-z0-9.-]+\.apps\.bootload\.io' | head -1 || true)
          {
            echo "### Bootload deployment"
            echo ""
            echo "Image: \`${{ steps.push.outputs.image }}\`"
            if [ -n "$HOST" ]; then echo "URL: https://$HOST"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Service status
        run: |
          sleep 20
          bootload status energy-loop --project test1 || true
          echo "--- recent logs ---"
          timeout 30 bootload logs energy-loop --project test1 2>&1 | tail -50 || true
